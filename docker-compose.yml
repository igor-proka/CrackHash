services:
  manager:
    build:
      context: ./manager
    ports:
      - "8082:8082"
    environment:
      - WORKER_URLS=http://worker-1:8081,http://worker-2:8081,http://worker-3:8081
      - JAVA_TOOL_OPTIONS=-Xmx800m
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - crackhash-net

  worker-1:
    build:
      context: ./worker
    environment:
      - MANAGER_URL=http://manager:8082
      - JAVA_TOOL_OPTIONS=-Xmx800m
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - crackhash-net

  worker-2:
    build:
      context: ./worker
    environment:
      - MANAGER_URL=http://manager:8082
      - JAVA_TOOL_OPTIONS=-Xmx800m
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - crackhash-net

  worker-3:
    build:
      context: ./worker
    environment:
      - MANAGER_URL=http://manager:8082
      - JAVA_TOOL_OPTIONS=-Xmx800m
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - crackhash-net

  client:
    build:
      context: ./client
    ports:
      - "80:80"
    networks:
      - crackhash-net
    depends_on:
      - manager

networks:
  crackhash-net:
    driver: bridge
