apiVersion: 1

# Provider подхватывает JSON-dashboard из monitoring/grafana/dashboards.
providers:
  - name: CrackHash
    orgId: 1
    folder: CrackHash
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
